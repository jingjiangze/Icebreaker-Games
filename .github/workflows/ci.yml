name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    env:
      NO_COLOR: '1'
    steps:
      # the engine is a git submodule (engine/)
      - uses: actions/checkout@v7
        with:
          submodules: true

      # 我方对 engine 的改动在 patches/ 里（没有上游写权限，engine 是只读 submodule）。CI 必须先打上，
      # 否则测的是纯净上游：client 引用的 RendererOptions.backdrop、CoopState.sides 等会报 TS2353/TS2339。
      # 打不上就是 patch 与固定提交 c8af98d 脱节，直接红——这正是要暴露的。
      - name: Apply engine patches
        shell: bash
        run: |
          for p in patches/*.patch; do
            echo "applying $p"
            git -C engine apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done
          git -C engine diff --stat

      # the pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # lint (limits, boundaries, determinism of the mode plugins), types, tests with coverage, and the dependency /
      # spec-tracing / registry checks (aue-check from the engine's @aue/testkit)
      - name: CI
        run: pnpm run ci

  # end-to-end: real Chromium against the in-process server; not part of pnpm run ci
  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Apply engine patches
        shell: bash
        run: |
          for p in patches/*.patch; do
            echo "applying $p"
            git -C engine apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm run e2e
